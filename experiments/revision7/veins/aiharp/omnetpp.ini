# Revision-5 H3 base configuration. Per-run values (sim-time-limit, seed-set, policy, knob, files,
# playground) are passed on the command line by run_veins.py; config.xml is written per scenario.
[General]
network = AiharpScenario
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 120s
**.cmdenv-log-level = warn
**.scalar-recording = true
**.vector-recording = false
*.playgroundSizeZ = 50m
*.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

*.manager.updateInterval = 0.1s
*.manager.autoShutdown = true
*.manager.commandLine = "$command --remote-port $port --configuration-file $configFile --no-step-log true --no-warnings true"
*.manager.configFile = "veins.sumocfg"
*.manager.moduleType = "org.car2x.veins.nodes.Car"

*.connectionManager.sendDirect = true
*.connectionManager.drawMaxIntfDist = false

*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 100mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -85dBm
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -95dBm
*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='isotropic']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.5 m

*.node[*].applType = "AiharpApp"
*.node[*].appl.headerLength = 0 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.beaconInterval = 0.1s
*.node[*].appl.beaconLengthBits = 2400 bit
*.node[*].appl.beaconUserPriority = 0
*.node[*].appl.dataLengthBits = 2400 bit
*.node[*].appl.dataUserPriority = 4
*.node[*].appl.dataOnSch = false
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

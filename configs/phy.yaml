# =============================================================================
# AI-HARP -- PHY and MAC parameters for IEEE 802.11p / DSRC at 5.9 GHz.
#
# EVERY numeric constant used by sim/phy.py and sim/mac.py lives here. Nothing
# is hardcoded in the simulator. Each block carries a `source:` field so the
# paper can cite the provenance of each value.
#
# Provenance tags used in `source:` fields:
#   [STD]          - fixed by a published standard, value checked.
#   [STD-COMPUTED] - computed at runtime from a standard's own equations
#                    (see sim/itu.py), and validated against that standard's
#                    published table. Nothing to get wrong by hand.
#   [STD-UNVERIFIED] - attributable to a named standard, but we could NOT
#                    access the primary document to check the number. IEEE
#                    802.11 is paywalled and ETSI blocks automated download.
#                    Anyone with institutional access should confirm these.
#   [MEAS]         - taken from a published measurement campaign.
#   [DERIVED]      - computed from other values in this file (formula given).
#   [ASSUMED]      - modelling choice by us; defend it in the paper text.
#   [INERT]        - recorded for completeness and for the paper's parameter
#                    table, but read by NO computation. Its value cannot
#                    affect any result. tests/test_mac.py asserts this stays
#                    true, so wiring one in forces verification first.
# =============================================================================

radio:
  carrier_frequency_hz: 5.9e9
  # source: [STD] IEEE 802.11p / ITS-G5 control channel (CCH 178) centre
  #         frequency 5.890 GHz; 5.9 GHz used as the nominal band centre.
  bandwidth_hz: 10.0e6
  # source: [STD] IEEE 802.11-2016 Clause 17 (OFDM) 10 MHz channel spacing
  #         used by 802.11p, i.e. half-clocked 802.11a.
  data_rate_mbps: 6.0
  # source: [STD] QPSK, rate 1/2 in a 10 MHz channel = 6 Mb/s. The mandatory
  #         rate for DSRC safety broadcast.
  tx_power_dbm: 20.0
  # source: [ASSUMED] Typical on-board-unit output power. FCC 47 CFR 90.377
  #         permits up to 33 dBm EIRP for private OBUs; 20 dBm is the common
  #         value in the V2X simulation literature.
  tx_antenna_gain_dbi: 3.0
  rx_antenna_gain_dbi: 3.0
  # source: [ASSUMED] Roof-mounted omnidirectional monopole, 3 dBi is the
  #         conventional value for vehicular OBU antennas.
  noise_figure_db: 9.0
  # source: [ASSUMED] Commodity 802.11p receiver front end (6-10 dB typical).
  thermal_noise_density_dbm_hz: -174.0
  # source: [STD] kTB at T0 = 290 K: 10*log10(1.38e-23 * 290 * 1e3) dBm/Hz.

receiver:
  sinr_threshold_db: 8.0
  # source: [STD-UNVERIFIED] Required SINR for QPSK 1/2 OFDM at 10% PER.
  #         IEEE 802.11-2020 Table 17-18 gives -85 dBm minimum sensitivity for
  #         QPSK 1/2 in a 10 MHz channel which, with the -95 dBm noise floor
  #         derived below, implies ~10 dB; 8 dB is the commonly simulated
  #         value. LOAD-BEARING: this sets the decode threshold and therefore
  #         PDR. Sweep it if the primary document is unavailable.
  sensitivity_dbm: -85.0
  # source: [STD-UNVERIFIED] IEEE 802.11-2020 Table 17-18, 6 Mb/s, 10 MHz.
  #         An absolute floor applied in addition to the SINR test.
  #         LOAD-BEARING: this sets the nominal communication range (562 m).
  capture_enabled: true
  # source: [ASSUMED] Model a receiver as able to lock onto the strongest
  #         frame (physical-layer capture) rather than losing every colliding
  #         frame. Disabling this gives the pessimistic no-capture model.

# -----------------------------------------------------------------------------
# Large-scale path loss: DUAL-SLOPE (breakpoint) log-distance.
#
#   PL(d) = PL(d0) + 10*n1*log10(d/d0)                          d <= d_bp
#   PL(d) = PL(d0) + 10*n1*log10(d_bp/d0) + 10*n2*log10(d/d_bp) d >  d_bp
#
# The breakpoint is NOT cosmetic. Below it the link is near free space
# (n1 ~ 1.9); beyond it the ground-reflected ray arrives out of phase with the
# direct ray and the decay steepens sharply (n2 ~ 3.8). A single-slope n = 1.9
# model extrapolated over kilometres predicts a ~2 km DSRC range, which is
# roughly 4x the measured value and would silently turn a sparse corridor into
# a fully connected one -- i.e. it would delete the problem this paper studies.
#
# The theoretical two-ray breakpoint is 4*h_t*h_r/lambda; for 1.5 m antennas at
# 5.9 GHz (lambda = 5.08 cm) that is ~177 m, consistent with the measured
# 100-220 m range below.
# -----------------------------------------------------------------------------
path_loss:
  model: dual_slope
  reference_distance_m: 1.0
  reference_loss_db: null
  # source: [DERIVED] If null, PL(d0) is computed as free-space loss at d0:
  #         20*log10(4*pi*d0*f/c). At 5.9 GHz and d0 = 1 m this is 47.86 dB.
  #         Set a number here to override with a measured intercept.
  breakpoint_distance_m: null
  # source: [DERIVED] When null, the breakpoint is computed from the two-ray
  #         ground-reflection geometry that causes it:
  #
  #             d_bp = 4 * h_t * h_r / lambda
  #
  #         the distance at which the direct and ground-reflected rays fall
  #         out of phase. With 1.5 m antennas at 5.9 GHz (lambda = 50.8 mm)
  #         this gives 177 m. Deriving it removes a recalled measurement
  #         constant and ties the breakpoint to the antenna height, which is a
  #         quantity the paper states anyway.
  #
  #         Set a per-scenario number here to override with a measured fit,
  #         e.g. Cheng et al., IEEE JSAC 25(8), 2007.
  antenna_height_m:
    rural_highway: 1.5
    urban_grid: 1.5
    urban_nlos: 1.5
    # source: [ASSUMED] Roof-mounted OBU antenna on a passenger car. Trucks sit
    #         higher (~3 m) which would push the breakpoint out to ~700 m; the
    #         model uses a single fleet-average height.
  exponent:
    # n1: below the breakpoint.
    rural_highway: 1.9
    # source: [MEAS] Highway LOS V2V, near free space (Cheng et al. 2007;
    #         Karedal et al., IEEE TWC 2011).
    urban_grid: 2.0
    urban_nlos: 2.0
  exponent_far:
    # n2: above the breakpoint, ground-reflection dominated.
    rural_highway: 3.8
    # source: [MEAS-UNVERIFIED] Cheng et al. 2007 report n2 ~ 3.8 beyond the
    #         breakpoint on highways. The two-ray model's theoretical asymptote
    #         is exactly 4.0 for a perfectly reflecting ground; real ground is
    #         lossy, so a fitted value slightly below 4 is expected and 3.8 is
    #         physically sensible. We could not open the paper to confirm the
    #         exact fit, so n2 is reported as a SENSITIVITY over {3.6, 3.8,
    #         4.0} rather than as a fixed known value. LOAD-BEARING: it sets
    #         the nominal range and therefore the connectivity regime.
    urban_grid: 4.2
    urban_nlos: 4.2
    # source: [MEAS-UNVERIFIED] Urban adds building shadowing on top of the
    #         two-ray decay. See urban_nlos for an explicitly modelled
    #         alternative that does not rely on a lumped exponent.
  shadowing_std_db:
    rural_highway: 3.0
    urban_grid: 5.2
    urban_nlos: 5.2
    # source: [MEAS] Log-normal shadowing standard deviation, same references.
    #         Held constant per link (not resampled per packet) in sim/phy.py.
  shadowing_decorrelation_m: 25.0
  # source: [ASSUMED] Gudmundson-style spatial correlation distance for
  #         vehicular shadowing; the per-link shadowing value is redrawn once
  #         a pair has moved this far. Keeps shadowing from being white noise.

# -----------------------------------------------------------------------------
# Small-scale fading: Nakagami-m. The received *power* gain is Gamma
# distributed with shape m and unit mean.
# -----------------------------------------------------------------------------
fading:
  model: nakagami
  m:
    urban_nlos: 1.0
    # source: [MEAS] NLOS links have no dominant component, so m -> 1
    #         (Rayleigh). This is the physically right value for a link that
    #         exists only via diffraction.
    rural_highway: 3.0
    # source: [MEAS] Strong-LOS highway V2V. m in 3-5 is the usual fit for
    #         open highway at short range (Cheng et al. 2007). m=3 is the
    #         conservative end of that range.
    urban_grid: 1.5
    # source: [MEAS] Weaker LOS / more scattering in urban canyons; m -> 1
    #         degenerates to Rayleigh.
  resample_per_packet: true
  # source: [ASSUMED] Fast fading is independent per transmitted frame
  #         (coherence time at 5.9 GHz and highway speeds is ~1 ms, far below
  #         the 100 ms simulation step).

# -----------------------------------------------------------------------------
# WEATHER
#
# READ THIS BEFORE USING THE WEATHER RESULTS IN THE PAPER.
#
# This project models NO empirical weather attenuation of the radio channel.
# That is a deliberate deletion, not an omission, and the reasoning has to
# survive review:
#
#   1. The genuine hydrometeor attenuation is computed exactly, at 5.9 GHz,
#      from ITU-R P.838-3 (rain) and P.840-8 (fog) in sim/itu.py -- from the
#      Recommendations' own governing equations, not from a tabulated row at a
#      neighbouring frequency. The result is that weather is irrelevant to the
#      link budget at this carrier:
#
#         heavy rain,  25 mm/h, vertical pol : 0.0713 dB/km = 0.040 dB per hop
#         violent rain,50 mm/h, vertical pol : 0.2130 dB/km = 0.120 dB per hop
#         thick fog,   0.5 g/m^3            : 0.0120 dB/km = 0.007 dB per hop
#
#      Against a ~100 dB path loss and 3-5 dB of shadowing, none of this is
#      measurable. P.840-8 says so itself: fog attenuation matters "at
#      frequencies of the order of 100 GHz and above".
#
#   2. Earlier revisions carried an `excess_loss_db_per_km` term (2/5/1 dB/km)
#      and an `exponent_delta` to represent wet-road scattering, truck spray
#      and antenna wetting. Those numbers were INVENTED. A search for a
#      published V2V measurement campaign quantifying rain-induced excess loss
#      at 5.9 GHz found nothing usable -- the measurement literature on weather
#      attenuation is concentrated at mmWave, precisely because the effect is
#      too small to be worth measuring down here. Rather than ship numbers the
#      paper cannot cite, they are set to zero and the mechanism is retained
#      only so that a properly cited value can be dropped in later.
#
# What remains is the BEHAVIOURAL effect of weather, which is well attested and
# needs no channel model: drivers slow down and increase headway. That changes
# vehicle density, spacing and therefore network topology -- a real and
# citable weather effect on dissemination.
#
# Consequence for the paper, state it plainly: in this model weather degrades
# hazard dissemination through TRAFFIC, not through the radio channel. The
# strongest version of the argument is that fog destroys *optical* sensing
# while leaving 5.9 GHz untouched, which is exactly why V2X warning matters
# most in fog -- the radio is the one sense that still works.
#
# If a channel-level weather effect is wanted later, the defensible route is a
# two-ray model with Fresnel reflection off a wet surface (the permittivity of
# a water film differs sharply from dry asphalt, which deepens the
# post-breakpoint destructive interference). That is derivable from first
# principles rather than needing a measurement campaign. It is not implemented.
# -----------------------------------------------------------------------------
weather:
  # Hydrometeor attenuation is COMPUTED, not configured. sim/itu.py evaluates
  # ITU-R P.838-3 eqs (2)(3) and P.840-8 eqs (2)-(11) at radio.carrier_frequency_hz.
  # There are deliberately no k / alpha / K_l constants to get wrong here.
  itu_rain_polarisation: vertical
  # source: [STD-COMPUTED] ITU-R P.838-3. Vertical is the physically correct
  #         choice for roof-mounted vertical monopoles. Horizontal gives a
  #         ~1.5x larger k at 5.9 GHz (0.109 vs 0.071 dB/km at 25 mm/h);
  #         both are negligible, so the choice changes no conclusion.
  fog_temperature_k: 283.15
  # source: [ASSUMED] 10 C, representative of road-level radiation fog. K_l is
  #         weakly temperature dependent and the term is negligible regardless.

  enable_empirical_excess_loss: false
  # Master switch for the deleted term. Leave false unless a cited measurement
  # is supplied, and if it is ever enabled, report it as an EMPIRICAL EXCESS
  # term and never as ITU-R attenuation.

  conditions:
    clear:
      rain_rate_mm_h: 0.0
      fog_liquid_water_g_m3: 0.0
      excess_loss_db_per_km: 0.0
      exponent_delta: 0.0
      visibility_m: 10000.0
      speed_factor: 1.00
      headway_factor: 1.00

    moderate_rain:
      rain_rate_mm_h: 5.0
      # source: [STD] WMO/AMS convention: moderate rain is 2.5-7.6 mm/h.
      fog_liquid_water_g_m3: 0.0
      excess_loss_db_per_km: 0.0
      exponent_delta: 0.0
      # Zeroed: no citable V2V measurement. See the block comment above.
      visibility_m: 2000.0
      speed_factor: 0.93
      # source: [MEAS] Rain reduces free-flow speed by ~5-10% (Highway
      #         Capacity Manual weather adjustment factors; Rakha et al.
      #         weather-speed models). Feeds the mobility layer, not the PHY.
      headway_factor: 1.15

    heavy_rain:
      rain_rate_mm_h: 25.0
      # source: [STD] WMO/AMS convention: heavy rain is > 7.6 mm/h; 25 mm/h
      #         is a representative heavy-rain rate.
      fog_liquid_water_g_m3: 0.0
      excess_loss_db_per_km: 0.0
      exponent_delta: 0.0
      visibility_m: 500.0
      speed_factor: 0.85
      # source: [MEAS] HCM weather adjustment: heavy rain 10-15% speed drop.
      headway_factor: 1.30

    dense_fog:
      rain_rate_mm_h: 0.0
      fog_liquid_water_g_m3: 0.5
      # source: [STD] ITU-R P.840-8 Section 1 gives 0.5 g/m^3 as thick fog,
      #         visibility of the order of 50 m.
      excess_loss_db_per_km: 0.0
      exponent_delta: 0.0
      visibility_m: 80.0
      speed_factor: 0.80
      # source: [MEAS] HCM: low visibility produces the largest speed drops.
      headway_factor: 1.40

# -----------------------------------------------------------------------------
# BUILDING NLOS (urban_nlos scenario only)
#
# Why: the rural corridor only fragments below ~3 veh/km/lane, which is an
# implausibly empty road for a paper about sparse connectivity. Buildings reach
# the same regime at densities where the street is visibly busy, because two
# vehicles on perpendicular streets simply cannot see each other.
#
# Model (sim/buildings.py): a link is LOS only if both endpoints share a street.
# Otherwise the signal travels the Manhattan path around the corner and pays a
# knife-edge diffraction loss:
#
#     excess_dB = PL(d_manhattan) - PL(d_euclidean) + corner_loss_db
#
# Charging it as an excess over the LOS model leaves path loss, shadowing and
# fading untouched.
# -----------------------------------------------------------------------------
nlos:
  street_half_width_m: 8.0
  # source: [DERIVED] Half the carriageway width of a two-way urban street with
  #         3.2 m lanes plus parking/footway allowance. Two vehicles within this
  #         lateral offset are treated as sharing a street, hence LOS.
  corner_loss_db:
    rural_highway: 0.0
    urban_grid: 0.0
    # Zero disables the whole mechanism, so the two original scenarios are
    # bit-for-bit unaffected by adding this block.
    urban_nlos: 20.0
    # source: [ASSUMED] Single knife-edge diffraction around a building corner.
    #         Measured urban V2V corner losses are commonly reported in the
    #         15-30 dB range; 20 dB is mid-range and is SWEPT in the sensitivity
    #         analysis rather than treated as known (analysis/pareto.py).
    #         LOAD-BEARING: it sets the NLOS range and therefore how fragmented
    #         the urban network is.

# -----------------------------------------------------------------------------
# MAC: approximate CSMA/CA broadcast (IEEE 802.11p EDCA).
# Broadcast frames are UNACKNOWLEDGED: no RTS/CTS, no retransmission, no
# binary exponential backoff (the CW never grows because there is no ACK
# timeout to trigger it).
# -----------------------------------------------------------------------------
mac:
  slot_time_us: 13.0
  sifs_us: 32.0
  difs_us: 58.0
  # source: [STD-UNVERIFIED] [INERT] IEEE 802.11-2020 Table 17-21, 10 MHz OFDM
  #         PHY: aSlotTime = 13 us, aSIFSTime = 32 us, DIFS = SIFS + 2*slot.
  #         These are the values used throughout the VANET simulation
  #         literature (and by ns-3's 802.11p model), but we could not open the
  #         primary IEEE document to confirm them.
  #         INERT: at a 100 ms decision epoch, interframe spacing of tens of
  #         microseconds is four orders of magnitude below the timestep, so
  #         sim/mac.py reads none of these three. They affect no result.
  access_category: AC_VI
  # source: [STD-UNVERIFIED] Which access category an ETSI hazard DENM is sent
  #         on is fixed by ETSI's traffic-class mapping (EN 302 663 /
  #         EN 302 636-4-1), not by 802.11, and has not been checked. AC_VI is
  #         a common mapping for event-driven safety messages; many ITS-G5
  #         deployments use AC_VO for safety-critical DENMs instead, which
  #         would make cw_min = 3.
  #         *** LOAD-BEARING: this choice selects cw_min below. ***
  cw_min: 7
  # source: [STD] IEEE 802.11-2020 default EDCA parameters for
  #         dot11OCBActivated = true, checked by the user on 2026-09-14 (table
  #         number not recorded): aCWmin = 15, aCWmax = 1023 for the OFDM PHY;
  #         AC_BK 15/1023/AIFSN 9, AC_BE 15/1023/6, AC_VI (aCWmin+1)/2-1 = 7 /
  #         CWmax aCWmin = 15 / 3, AC_VO (aCWmin+1)/4-1 = 3 / 7 / 2.
  #         7 is therefore the correct CWmin FOR AC_VI; whether AC_VI is the
  #         right category is the unverified access_category above.
  #         *** LOAD-BEARING: the backoff window is CWmin + 1 = 8 slots, which
  #         drives the whole collision model:
  #         P(tie) = 1 - (1 - 1/(CWmin+1))^(n-1). ***
  #         Until the ETSI mapping is checked, report a sensitivity across
  #         AC_VO (3), AC_VI (7) and AC_BE (15). NOT YET RUN: no experiment
  #         currently varies cw_min.
  cw_max: 15
  # source: [STD] [INERT] CWmax for AC_VI = aCWmin = 15 (same 802.11-2020 OCB
  #         EDCA table as cw_min). Broadcast frames are unacknowledged so there
  #         is no ACK timeout to grow the window: the CW never leaves cw_min and
  #         sim/mac.py never reads cw_max. Carried for the parameter table and
  #         for future unicast-relay variants.
  aifsn: 3
  # source: [STD] [INERT] AIFSN for AC_VI = 3 (same 802.11-2020 OCB EDCA
  #         table). Not read by sim/mac.py, for the same timestep-granularity
  #         reason as the interframe spacing.
  frame_bytes: 300
  # source: [ASSUMED] An ETSI DENM hazard notification with security headers
  #         is a few hundred bytes; 300 B is representative.
  carrier_sense_threshold_dbm: -92.0
  # source: [ASSUMED] Clear-channel-assessment energy-detect threshold. Sets
  #         the contention neighbourhood: nodes that hear each other above
  #         this level contend rather than collide.
  interference_margin_db: 10.0
  # source: [DERIVED] A concurrent transmitter is treated as a potential
  #         interferer at a receiver if its received power is within this
  #         margin of the noise floor, i.e. down to (noise + 0 dB). Used to
  #         bound the interferer set cheaply; weaker signals are folded into
  #         the noise term anyway.
  channel_busy_suppression: true
  # source: [ASSUMED] If the medium is sensed busy at the decision instant,
  #         the frame is deferred to the next slot rather than dropped. This
  #         is what CSMA does; disabling it models a pure ALOHA channel.

  # Background beacon load. Hazard dissemination does NOT have the channel to
  # itself: every vehicle also emits periodic CAM/BSM position beacons, and in
  # dense traffic that is the dominant source of channel load and of frame
  # loss. Omitting it would make every policy look better than it is, and
  # would flatter flooding most of all, because flooding's cost is exactly the
  # channel load it adds on top of this floor.
  background_beacon_enabled: true
  background_beacon_hz: 10.0
  # source: [STD] SAE J2735 BSM / ETSI EN 302 637-2 CAM generation rate.
  #         10 Hz is the standard maximum and the usual simulation default.
  background_beacon_bytes: 300
  # source: [ASSUMED] A signed CAM/BSM is ~200-400 B.

  # Decentralised Congestion Control. Without DCC, a fixed 10 Hz beacon rate
  # offers more than 100% channel load once a few hundred vehicles share a
  # carrier-sense neighbourhood, the medium is permanently sensed busy, and NO
  # hazard message is ever transmitted at all. That collapse is an artefact of
  # omitting DCC, not a finding: every deployed DSRC/ITS-G5 stack adapts its
  # beacon rate to keep channel load bounded.
  dcc_enabled: true
  dcc_target_cbr: 0.62
  # source: [STD] ETSI TS 102 687 (Decentralized Congestion Control for
  #         ITS-G5). The standard's state machine targets a channel busy ratio
  #         around 0.6-0.68; we model the adaptive-rate limit directly rather
  #         than simulating the full state machine. [VERIFY] exact threshold.
  dcc_min_beacon_hz: 1.0
  # source: [STD] ETSI TS 102 687 floors the message rate at 1 Hz; below this
  #         the beacon service is no longer useful for cooperative awareness.
  vulnerable_window_frames: 2.0
  # source: [STD] For unslotted contention the vulnerable period of a frame is
  #         twice its duration: an interferer starting anywhere in that window
  #         overlaps it. Classic ALOHA/CSMA result.

# =============================================================================
# AI-HARP -- learned agent: graph, encoder, action space, reward, training.
#
# Phase 5. Requires torch + torch-geometric; nothing in Phases 1-4 imports this
# file, so the existing test suite runs without them.
# =============================================================================

graph:
  neighbour_cap_k: 12
  # source: [ASSUMED] Nearest-k neighbours kept per decision graph, so batches
  #         have bounded size. Swept in the ablations over {4, 8, 12, 20}.
  include_rsus: true
  radius_source: nominal_range
  # Neighbourhood radius comes from the PHY's own nominal range rather than a
  # separate constant, so it tracks weather and scenario automatically.

  node_features:
    # Everything here must be obtainable at decision time from CAM/BSM beacons
    # plus the vehicle's own state. tests/test_oracle_isolation.py enforces
    # that the ORACLE risk field never reaches this list.
    - rel_x                 # position relative to the holder (m)
    - rel_y
    - rel_vx                # velocity relative to the holder (m/s)
    - rel_vy
    - heading_sin
    - heading_cos
    - eta_to_hazard_s       # from hazard/risk_field.py -- the CAUSAL estimate
    - relevance_causal      # likewise causal; never the oracle
    - is_informed           # only what this vehicle has actually overheard
    - neighbour_count
    - hop_count
    - message_age_s
    - ttl_remaining_s
    - is_rsu

  edge_features:
    - distance_m
    - relative_speed_ms
    - link_lifetime_s       # estimated from closing rate
    - predicted_rssi_dbm    # from sim/phy.py median link budget
    - heading_difference_rad

  normalisation:
    mode: frozen
    stats_path: results/feature_stats.json
    holdout_seeds: [900, 901, 902, 903, 904]
    fit_densities: [2, 5, 20, 80]
    fit_seeds: 2
    fit_graphs: 2000
    # source: [DERIVED] Fit across EVERY training scenario, spanning the
    #         curriculum's density range, striding through each run. The first
    #         fit kept the first 120 graphs it saw -- all from the opening
    #         ~0.3 s of one rural run -- so rel_vy and heading_sin had std 0
    #         (an east-west corridor) and message_age_s had std 0.07 s against
    #         a 60 s TTL. Urban episodes then fed the encoder inputs scaled by
    #         up to ~1e6.
    # source: [ASSUMED] Feature statistics are computed once on held-out traces
    #         and FROZEN. Per-batch normalisation would make a vehicle's
    #         features depend on its batch-mates, which is impossible to
    #         reproduce in per-vehicle decentralised execution.

encoder:
  type: gatv2               # ablated against: gcn, mlp
  layers: 3
  heads: 4                  # ablated over {1, 4, 8}
  hidden_dim: 64
  edge_dim: 5
  residual: true
  layer_norm: true
  dropout: 0.0
  # source: [DERIVED] Zero, deliberately. With dropout on, a rollout's log-prob
  #         is sampled under one dropout mask and re-evaluated in the PPO
  #         update under another, so the importance ratio mixes mask noise
  #         with genuine policy change and clipping fires on noise. The first
  #         on-policy 40-update run was launched with 0.1 and carries this.
  attention_as_relay_logits: true
  # The attention weights over neighbours ARE the relay-selection logits, not a
  # by-product read out for visualisation. This is what makes the architecture
  # interpretable and what produces the attention-heatmap figure.

action_space:
  # Deliberately small and discrete; identical in structure to what the Phase 4
  # baselines already express, so the comparison is like-for-like.
  actions:
    - suppress
    - broadcast_now
    - defer_1
    - defer_2
    - defer_3
    - relay_top_1
    - relay_top_2
    - relay_top_3
    - carry_and_forward
  defer_epochs: [1, 2, 3]
  defer_cancel_on_duplicates: 1
  # source: [DERIVED] A deferred rebroadcast is cancelled on hearing one
  #         duplicate, exactly as for the slotted baselines
  #         (configs/policies.yaml). Without it the agent's defer was
  #         "broadcast later", strictly dominated by broadcasting now, and the
  #         action space could not express slotted-style suppression at all.
  suppress_is_final: true
  # A network (or fallback) SUPPRESS on a received message is final for that
  # vehicle; later duplicates do not re-query it. Carriers are still
  # re-evaluated. Measured on an untrained network at rural d=40: 90% of
  # suppress decisions were followed by a re-ask and a transmission, which
  # turned a +11.58 advantage for staying silent into -8.02, and PPO drove
  # suppress from ~15% of decisions to 0.35%.
  max_carries_per_vehicle: 3
  # source: [DERIVED] After this many carry_and_forward decisions a vehicle may
  #         only suppress, broadcast, defer or relay (carry is masked inside
  #         the network's sampling, and the mask is stored with the transition
  #         so PPO re-applies it). run6 collapsed onto carry at update 41:
  #         92-94% of decisions, 16-20 decisions per informed vehicle, entropy
  #         0.73 -> 0.27, fewer vehicles reached than slotted_1p. Carrying cost
  #         nothing, never settled, and the reward lands on a vehicle's last
  #         decision. 3 x carry_recheck (1 s) keeps genuine store-carry-forward
  #         across short gaps.
  # 100 ms per epoch. Note the README limitation: this granularity inflates the
  # absolute latency of every deferring scheme, baselines and agent alike.

confidence_gate:
  enabled: true
  method: entropy           # entropy | ensemble
  tau: 0.5                  # swept over {0, 0.1, 0.3, 0.5, 0.7} in the ablations
  fallback_policy: weighted_p
  ensemble_size: 5
  # source: [ASSUMED] Above tau the learned action executes; below it the
  #         policy defers to a known-good analytic scheme. This is a named
  #         contribution: the safety claim is that a learned policy never
  #         silently fails in a safety-critical broadcast, and the gate is
  #         where that claim is earned. The fallback rate is logged as a
  #         first-class metric, not as a diagnostic.

# -----------------------------------------------------------------------------
# REWARD
#
#   r = w1 * d(relevance-weighted informed)
#     - w2 * (transmission cost)
#     - w3 * (collisions caused)
#     - w4 * (actionable deadline miss)
#     + w5 * (at-risk set covered before hazard arrival)
#
# w1, w2 and w3 are CALIBRATED, not chosen -- see analysis/reward_calibration.py.
#
# The TOTAL price of one transmission is w2 + w3 * E[collisions it causes], and
# that total is what must equal mean_relevance / target_cost. The measured
# baseline front puts the deployable cluster at 0.41 transmissions per at-risk
# vehicle informed and flooding at 2.11; with mean at-risk relevance ~0.75:
#
#     total price, target 0.41-class : 0.75 / 0.41 = 1.83   <-- configured
#     total price, flooding-class    : 0.75 / 2.11 = 0.36
#
# Any total below ~0.36 makes blind flooding reward-optimal; the configured
# total sits 5.15x above that boundary. Split as w2 = 1.33 and
# w3 * 2.0 coll/tx = 0.50, using the collision rate measured at the target.
#
# Reported as a sensitivity over {0.25, 0.5, 1.0, 1.83, 3.0, 6.0} rather than
# asserted to be correct.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# OBJECTIVE -- constrained. Replaces the weighted-sum reward below.
#
#   maximise  -(transmissions) / n_at_risk   subject to  causal coverage >= C*
#
#   r_v    = -(tx_v + collision_weight * coll_v) + lambda * credit_v
#   lambda <- clip(lambda + lambda_lr * mean_e[(C*_e - C_e) / C*_e], 0, lambda_max)
#
# credit_v is a Shapley split of each warned at-risk vehicle's relevance along
# its ancestor path in the informed_by tree (agents/constrained_reward.py), so
# relays have a stake in coverage they enabled downstream.
#
# Gate before any training: `python -m analysis.reward_check` must report SANE
# (silence escapable below lambda_max; an efficient scheme beating flooding).
# -----------------------------------------------------------------------------
objective:
  kind: constrained
  lambda_init: 2.0
  # source: [ASSUMED] Starting price of one unit of causal coverage, in
  #         transmissions per at-risk vehicle. Dual ascent moves it; the
  #         break-even at which silence stops being optimal is measured by
  #         analysis/reward_check.py, and the initial value should sit near it.
  lambda_lr: 1.0
  # source: [ASSUMED] Step per PPO update per unit of pooled normalised
  #         shortfall, (sum target - sum coverage) / sum target, per group.
  lambda_group_by: [scenario, density]
  # source: [DERIVED] One multiplier per (scenario, density), weather and hazard
  #         pooled. run4 stepped one global multiplier on the mean of
  #         per-episode shortfall ratios: low-target d=1 episodes that
  #         overshot outvoted real misses (update 35: coverage 0.451 vs target
  #         0.520, mean shortfall -0.048, lambda fell). A single pooled
  #         multiplier would instead let dense-cell surplus hide sparse-cell
  #         shortfall. Per-cell (96 multipliers) is too sparsely sampled for a
  #         ~200-update run. [] = one global pooled multiplier.
  lambda_max: 50.0
  # source: [ASSUMED] Cap. A saturated lambda means the constraint cannot be
  #         met even at maximum price; it is logged, not hidden.
  target_fraction: 0.95
  # source: [DERIVED] Same matched-quality convention as analysis/comparator.py:
  #         95% of each cell's measured ceiling.
  fallback_target: 0.80
  # source: [ASSUMED] Only for cells missing from the targets table, with a warning.
  collision_weight: 0.0
  # source: [DERIVED] Zero. Collisions already destroy coverage, which lambda
  #         prices. A separate hand weight is one more thing to get wrong: the
  #         old reward's collision weight inflated its effective transmission
  #         cost 5.5x before it was caught.
  targets_path: results/coverage_targets.json
  target_seeds: 2
  # Training-pool seeds per cell used to measure ceilings
  # (experiments/coverage_targets.py).

# !!! KNOWN BROKEN -- DO NOT TRAIN ON THIS REWARD. !!!
# The "calibration" above balanced one transmission against the relevance it
# directly informs. It never checked that the reward ranks whole POLICIES
# correctly, and it does not. Measured on rural d=40, evaluation seed 0:
#
#     policy            RWCR    tx   total reward   coverage/miss term per vehicle
#     always-suppress   0.020    1        +1.5         -0.0106
#     slotted_1p        0.954  175      -829.3         +0.0055
#     weighted_p        0.949  309     -2613.7         +0.0055
#     flooding          0.954  755     -9301.2         +0.0055
#
# Silence out-scores every working scheme. The coverage and miss terms are
# divided by the at-risk count and spread over all vehicles, so total failure
# versus near-perfect coverage moves the reward by 0.016 per vehicle, while
# each transmission costs >= 1.33. Training run3 found this optimum: after 11
# updates it reached RWCR 0.034, informing 23 of ~800 vehicles with a single
# transmission (eval seeds 0-1). The replacement objective is an open design
# decision; see README "Known limitations".
reward:
  w1_relevance_informed: 1.0
  w2_transmission_cost: 1.33
  # source: [DERIVED] Solved so that the TOTAL price of a transmission --
  #         w2 + w3 * E[collisions it causes] -- equals mean_relevance /
  #         target_cost = 0.75 / 0.41 = 1.83. With w3 = 0.25 and a measured
  #         2.0 collisions per transmission at the target operating point,
  #         w2 = 1.83 - 0.50 = 1.33.
  w3_collision: 0.25
  # source: [DERIVED] Sized so the collision term is ~27% of the price of a
  #         transmission at the target, and 2.2x the price under flooding
  #         (16.3 collisions/tx measured vs 2.0 at the target) -- a strong
  #         gradient away from storming without dominating the calibration.
  #
  #         It was 0.5 with the collision term EXCLUDED from the calibration.
  #         That made the effective cost 1.83 + 0.5*16.3 = 10.03, i.e. 5.5x
  #         the intended value, putting the break-even at 0.075 tx per at-risk
  #         vehicle informed against a 0.41 target. The agent would have
  #         learned near-silence and it would have looked like a result.
  #         Collisions are now attributed PER TRANSMITTER by the engine
  #         (sim/engine.py -> RunResult.collisions_caused) rather than as a
  #         network mean, which is what gives the term any per-vehicle signal.
  w4_deadline_miss: 4.0
  # source: [ASSUMED] A safety-deadline miss is the outcome the system exists
  #         to prevent; it must dominate a handful of wasted transmissions.
  #         Uses the ACTIONABLE miss rate -- penalising the agent for vehicles
  #         that were already unreachable at origination would be rewarding
  #         noise.
  w5_coverage_bonus: 2.0
  # source: [ASSUMED] Terminal bonus for the fraction of the at-risk set warned
  #         before it reaches the hazard. Shapes toward the end goal rather
  #         than per-step credit alone.
  normalise_by_at_risk_set: true
  # Rewards are divided by the size of the at-risk set so cells with 50 and
  # 500 at-risk vehicles contribute comparable gradient magnitudes.

  sensitivity_w2_over_w1: [0.25, 0.5, 1.0, 1.83, 3.0, 6.0]

algorithm:
  name: ppo                 # ppo | dueling_dqn (config flag, secondary result)
  shared_policy: true       # one policy for all vehicles
  centralised_training: true
  ppo:
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.2
    value_coef: 0.5
    entropy_coef: 0.01
    # Entropy matters doubly here: it regularises exploration AND it is the
    # quantity the confidence gate thresholds, so it must not be annealed to
    # zero or the gate loses its signal.
    lr: 3.0e-4
    epochs_per_update: 4
    minibatch_size: 256
    max_grad_norm: 0.5
  dueling_dqn:
    lr: 1.0e-4
    buffer_size: 100000
    batch_size: 128
    target_update_interval: 1000
    epsilon_start: 1.0
    epsilon_end: 0.05
    epsilon_decay_updates: 500
    double_q: true

training:
  total_updates: 2000
  rollout_episodes_per_update: 8
  rollout_workers: 1
  # Episodes of one update run in this many worker processes (1 torch thread
  # each); 1 = serial. Results are identical for any value: each episode's
  # policy randomness comes from a per-episode seed drawn from the training
  # RNG. Profiled on run7: per-decision inference 44%, simulator 25%, PPO step
  # 25% of an update, so a GPU would give ~1.2x; parallel CPU rollouts are the
  # speed-up. Left at 1 until benchmarked on an idle machine (run7 was training).
  checkpoint_every_updates: 100
  checkpoint_dir: checkpoints/
  tensorboard_dir: tb_logs/
  seed: 0
  deterministic: true
  train_seed_pool: {start: 100, count: 32}
  # Mobility seeds 100-131. Must stay disjoint from the evaluation seeds (0-9,
  # configs/experiment.yaml) and the normaliser hold-out (900-904);
  # agents/train.py refuses to start otherwise. Bounded so traces are cached
  # and reused -- an unbounded draw made every episode a cache miss.

  curriculum:
    # Start connected, anneal toward sparse: credit assignment is tractable
    # when a relay decision has an immediate visible consequence, and becomes
    # hard when the message must be carried across a gap.
    mode: density_anneal
    stages:
      - {until_frac: 0.25, densities: [40, 80]}
      - {until_frac: 0.50, densities: [10, 20, 40]}
      - {until_frac: 0.75, densities: [3, 5, 10, 20]}
      - {until_frac: 1.00, densities: [1, 2, 3, 5, 10, 20, 40, 80]}

  train_scenarios: [rural_highway, urban_nlos]
  held_out_scenarios: [urban_grid]
  # urban_grid is NEVER trained on: it is the unseen-topology generalisation
  # test. It is also the well-connected control.
  train_hazards: [fog_bank, landslide, crash]
  held_out_hazards: [waterlogging, black_ice]
  train_weather: [clear, heavy_rain]
  held_out_weather: [moderate_rain, dense_fog]
